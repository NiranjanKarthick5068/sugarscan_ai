<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SugarScan AI</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --frame-border: #22252a;
      --frame-glass: rgba(255, 255, 255, 0.05);
      --frame-radius: 40px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Desktop Phone Frame */
    .phone-frame {
      position: relative;
      width: 400px;
      height: 850px;
      border-radius: var(--frame-radius);
      border: 14px solid var(--frame-border);
      background: var(--bg-color);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Notch */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: var(--frame-border);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      z-index: 100;
    }

    /* Iframe holding the Expo app */
    .app-frame {
      flex: 1;
      width: 100%;
      border: none;
      background-color: #0b0c10; /* Expo bgPage */
    }

    /* Header for Desktop */
    .header {
      position: absolute;
      top: 40px;
      left: -320px;
      width: 280px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #aaff00, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Mobile view - Full bleed */
    @media (max-width: 800px) {
      .header {
        display: none;
      }
      .phone-frame {
        width: 100vw;
        height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .notch {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SugarScan AI</h1>
    <p>Live Web Demo</p>
    <p style="margin-top: 16px;">This wrapper demonstrates the Expo Web export running in a responsive mobile layout.</p>
  </div>
  
  <div class="phone-frame">
    <div class="notch"></div>
    <iframe class="app-frame" src="./app/index.html" title="SugarScan AI App"></iframe>
  </div>
</body>
</html>
